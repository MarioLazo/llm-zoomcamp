id: ingest_transcripts
namespace: aria

description: |
  Automated ingestion for ARIA (Automated Regulatory Intelligence Agent).
  Downloads the ONNX embedding model (once), then chunks the transcripts,
  embeds them, and upserts into Qdrant for hybrid search.

  Trigger manually from the Kestra UI, or on a schedule when new LEkE
  transcripts land in the transcripts directory.

inputs:
  - id: transcripts_dir
    type: STRING
    defaults: /data/sample     # switch to /data/real for the private corpus

triggers:
  - id: nightly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 2 * * *"          # 02:00 daily; remove if you prefer manual runs

tasks:
  - id: ingest
    type: io.kestra.plugin.scripts.python.Commands
    containerImage: aria-app:latest   # image built from the app Dockerfile
    namespaceFiles:
      enabled: true
    env:
      TRANSCRIPTS_DIR: "{{ inputs.transcripts_dir }}"
      QDRANT_URL: "http://qdrant:6333"
    commands:
      - python ingestion/download_model.py
      - python -m ingestion.ingest

  - id: report
    type: io.kestra.plugin.core.log.Log
    message: "Ingestion complete for {{ inputs.transcripts_dir }}"
